<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, initial-scale=1.0">
  <title>Tablet Casa</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app">

    <header>
      <div id="title">TABLET CASA</div>
      <div id="clock">00:00</div>
    </header>

    <main id="home">
      <div id="date"></div>

      <h1>OGGI</h1>

      <div id="waste"></div>

      <div id="waste-image"></div>

      <button onclick="showCalendar()">🗓️ CALENDARIO</button>
    </main>

    <main id="calendar" class="hidden">

      <button onclick="showHome()">🏠</button>

      <h1>🗓️ CALENDARIO</h1>

      <div id="calendar-date"></div>
      <div id="calendar-waste"></div>

      <div class="navigation">
        <button onclick="previousDay()">←</button>
        <button onclick="nextDay()">→</button>
      </div>

    </main>

    <main id="message" class="hidden">

      <div class="notification">🔔</div>

      <h1>NUOVO MESSAGGIO</h1>

      <button onclick="readMessage()">TOCCA PER LEGGERE</button>

    </main>

    <main id="message-content" class="hidden">

      <h1>💬 MESSAGGIO</h1>

      <div id="message-text"></div>

      <button onclick="closeMessage()">OK</button>

    </main>

  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
