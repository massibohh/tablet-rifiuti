```html
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablet Casa</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app">

    <header>
      <div id="title">📱 TABLET CASA</div>
      <div id="clock">Caricamento...</div>
    </header>

    <main id="home">
      <div id="date">Caricamento...</div>

      <h1>OGGI</h1>

      <div id="waste">Caricamento...</div>

      <div id="waste-image"></div>

      <button id="calendar-button">🗓️ CALENDARIO</button>
    </main>


    <main id="calendar" class="hidden">

      <button id="home-button">🏠</button>

      <h1>🗓️ CALENDARIO</h1>

      <div id="calendar-date"></div>

      <div id="calendar-waste"></div>

      <div class="navigation">
        <button id="previous-button">←</button>
        <button id="next-button">→</button>
      </div>

    </main>


    <main id="message" class="hidden">

      <div class="notification">🔔</div>

      <h1>NUOVO MESSAGGIO</h1>

      <button id="read-button">TOCCA PER LEGGERE</button>

    </main>


    <main id="message-content" class="hidden">

      <h1>💬 MESSAGGIO</h1>

      <div id="message-text"></div>

      <button id="ok-button">OK</button>

    </main>

  </div>


  <!-- ZONA TEST INVISIBILE -->
  <button id="test-message"></button>


  <script>
  document.getElementById("clock").textContent = "JS FUNZIONA!";
</script>

<script src="./data.js"></script>
<script src="./app.js"></script>

</body>
</html>
