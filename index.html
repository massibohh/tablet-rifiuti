<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800, height=480, initial-scale=1.0">
  <title>Tablet Casa</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app">

    <!-- SFONDO DELLA HOME -->
    <main id="home">

      <!-- Pulsante OGGI -->
      <button id="today-button" class="side-button"></button>

      <!-- Pulsante CALENDARIO -->
      <button id="calendar-button" class="side-button"></button>

      <!-- Pulsante MESSAGGI -->
      <button id="message-button" class="side-button"></button>

      <!-- Pulsante AVANTI -->
      <button id="next-page-button" class="side-button"></button>


      <!-- CONTENUTO DINAMICO -->
      <div id="home-content">

        <div id="clock"></div>

        <div id="date"></div>

        <div id="waste"></div>

        <div id="waste-image"></div>

      </div>

    </main>


    <!-- CALENDARIO -->
    <main id="calendar" class="hidden">

      <button id="home-button">⌂</button>

      <div id="calendar-date"></div>

      <div id="calendar-waste"></div>

      <div class="calendar-controls">
        <button id="previous-button">◀</button>
        <button id="next-button">▶</button>
      </div>

    </main>


    <!-- NOTIFICA MESSAGGIO -->
    <main id="message" class="hidden">

      <div class="message-icon">🔔</div>

      <div class="message-title">
        NUOVO MESSAGGIO
      </div>

      <button id="read-button">
        LEGGI
      </button>

    </main>


    <!-- CONTENUTO MESSAGGIO -->
    <main id="message-content" class="hidden">

      <div id="message-text"></div>

      <button id="ok-button">
        OK
      </button>

    </main>

  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
