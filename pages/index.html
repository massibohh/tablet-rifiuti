<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tablet Casa</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <div class="icon">📱</div>

    <h1>Tablet Casa</h1>
    <p class="subtitle">Invia un messaggio al tablet</p>

    <textarea
      id="message"
      maxlength="300"
      placeholder="Scrivi qui il messaggio..."
    ></textarea>

    <div class="counter">
      <span id="count">0</span>/300
    </div>

    <button id="sendButton">
      📤 Invia messaggio
    </button>

    <p id="status"></p>

  </main>

  <script src="script.js"></script>
</body>
</html>
